version: 2
updates:
  - package-ecosystem: gomod
    directories: ['/']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types: [patch, minor]
  - package-ecosystem: cargo
    directories: ['/', '/fuzz']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directories: ['/']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types: [patch, minor]
  - package-ecosystem: pip
    directories: ['/packaging/python']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types: [patch, minor]
