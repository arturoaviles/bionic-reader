name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  PROPTEST_CASES: '4096'

jobs:
  portable-core:
    name: Portable document engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum Rust and WebAssembly target
        run: rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Build portable engine on minimum Rust
        run: cargo +1.85.1 check --locked --lib --no-default-features --target wasm32-unknown-unknown
      - name: Build the shared WebAssembly payload once
        run: |
          rustup default 1.85.1
          scripts/install-wasm-bindgen.sh "$RUNNER_TEMP/wasm-tools"
          export WASM_BINDGEN="$RUNNER_TEMP/wasm-tools/wasm-bindgen"
          scripts/build-library-wasm.sh
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "bionic-reader"))')
          python3 scripts/package-library-candidate.py --version "$version" --output dist/library-api.tgz
      - name: Measure the installed API candidate
        # zizmor: ignore[adhoc-packages] Installs only our local candidate offline with lifecycle scripts disabled.
        run: |
          npm install --prefix "$RUNNER_TEMP/measure" --offline --ignore-scripts --no-audit --no-fund --omit=optional "$GITHUB_WORKSPACE/dist/library-api.tgz"
          cp scripts/report-library-performance.mjs "$RUNNER_TEMP/measure/"
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "bionic-reader"))')
          node "$RUNNER_TEMP/measure/report-library-performance.mjs" "$GITHUB_WORKSPACE/dist/library/lib/wasm/engine_bg.wasm" "$version" > dist/library/library-performance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bionic-reader-library-payload
          path: dist/library/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bionic-reader-library-api
          path: dist/library-api.tgz
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust checks
    needs: portable-core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Install session test shells
        run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - name: Install pinned Corepack in a temporary tool prefix
        run: |
          npm --cache "$RUNNER_TEMP/corepack-npm-cache" install \
            --prefix "$RUNNER_TEMP/bionic-reader-node-tools" \
            --ignore-scripts --no-save --no-audit --no-fund --package-lock=false \
            corepack@0.36.0
          echo "$RUNNER_TEMP/bionic-reader-node-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: msrv-native-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check and lint
        run: |
          make help
          make fmt-check check lint doc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-library-payload
          path: dist/library
      - name: Unit, CLI, and PTY tests
        run: |
          make test test-doc
      - name: Verify bounded memory with a 40 MiB transformed stream
        run: |
          cargo build --locked --release --bin bionic-reader
          python3 scripts/check-stream-memory.py target/release/bionic-reader
      - name: Package, install, and test the Cargo crate
        run: |
          scripts/check-cargo-package.sh
          package_manifest=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          package = next(package for package in metadata["packages"] if package["name"] == "bionic-reader")
          print("{}/package/{}-{}/Cargo.toml".format(metadata["target_directory"], package["name"], package["version"]))
          ')
          cargo test --locked --all-targets --manifest-path "$package_manifest"
      - name: Upload Cargo crate candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bionic-reader-cargo-crate
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 14
      - name: Check generated completion files
        run: make completions-check
      - name: Test offline npm, Yarn PnP, and pnpm installs
        run: |
          scripts/check-node-package-installs.sh target/debug/bionic-reader
          NODE_PACKAGE_MODE=standalone scripts/check-node-package-installs.sh target/debug/bionic-reader
          NODE_PACKAGE_MODE=registry scripts/check-node-package-installs.sh target/debug/bionic-reader

  coverage:
    name: Line, branch, and end-to-end coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage-build
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/coverage-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - name: Install pinned coverage tools and terminal shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish zsh
          rustup toolchain install nightly-2026-10-22 --profile minimal --component llvm-tools-preview
          echo RUSTUP_TOOLCHAIN=nightly-2026-10-22 >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1
          checksum: true
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: nightly-coverage-branch-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Measure unit, property, CLI, file-pipeline, and terminal workflows
        run: cargo llvm-cov --branch --locked --all-targets --no-report
      - name: Include actual upstream framework startup workflows
        run: |
          while IFS= read -r directory; do
            sudo chmod go-w "$directory"
          done < <(zsh -fc 'autoload -Uz compaudit; compaudit || true')
          eval "$(cargo llvm-cov show-env --branch --sh)"
          scripts/check-frameworks.sh
      - name: Export measured coverage and uncovered lines
        if: always()
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --ignore-filename-regex '/rustlib/src/rust/' --json --output-path target/coverage/coverage.json
          cargo llvm-cov report --ignore-filename-regex '/rustlib/src/rust/' --lcov --output-path target/coverage/lcov.info
          cargo llvm-cov report --ignore-filename-regex '/rustlib/src/rust/' --html --output-dir target/coverage
          cargo llvm-cov report --ignore-filename-regex '/rustlib/src/rust/' --show-missing-lines | tee target/coverage/summary.txt
      - name: Summarize measured coverage against the requested target
        run: |
          python3 - <<'PY'
          import json
          import os

          with open('target/coverage/coverage.json', encoding='utf-8') as source:
              totals = json.load(source)['data'][0]['totals']
          metrics = ('lines', 'regions', 'functions', 'branches')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Measured Rust coverage\n\n')
              summary.write('| Metric | Covered / total | Coverage | Target |\n')
              summary.write('| --- | --- | --- | --- |\n')
              for name in metrics:
                  value = totals[name]
                  summary.write(f"| {name} | {value['covered']} / {value['count']} | {value['percent']:.2f}% | 100% |\n")
              reached = all(totals[name]['percent'] == 100 for name in metrics)
              summary.write('\n100% target ' + ('reached.' if reached else 'remains open; see the uncovered-line and HTML artifacts.') + '\n')
          if totals['branches']['percent'] < 80:
              raise SystemExit('Branch coverage is below the transitional 80% floor')
          PY
      - name: Prevent coverage regressions while closing the 100 percent target
        run: cargo llvm-cov report --ignore-filename-regex '/rustlib/src/rust/' --fail-under-lines 92 --fail-under-regions 91 --fail-under-functions 88
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: target/coverage/
          if-no-files-found: error
          retention-days: 14

  rust-maintenance:
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-22
    name: Rust feature and dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned verification toolchain and tools
        run: |
          rustup toolchain install nightly-2026-10-22 --profile minimal
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-hack@0.6.45,cargo-udeps@0.1.61
          checksum: true
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: nightly-maintenance-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check feature combinations on the minimum compiler
        run: cargo +1.85.1 hack check --locked --feature-powerset --all-targets
      - name: Check for unused dependencies
        run: cargo +nightly-2026-10-22 udeps --locked --all-targets --all-features

  miri:
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-22
    name: Miri byte-stream checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Miri toolchain
        run: rustup toolchain install nightly-2026-10-22 --profile minimal --component miri --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: nightly-miri-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Interpret UTF-8 and ANSI boundary regressions
        # Real PTYs, processes, and signal handling remain covered by native integration tests.
        run: |
          cargo +nightly-2026-10-22 miri test --locked --lib transformer::tests::chunk_boundaries_inside_utf8_and_sgr_do_not_change_output -- --exact
          cargo +nightly-2026-10-22 miri test --locked --lib transformer::tests::malformed_bytes_are_preserved_while_surrounding_words_transform -- --exact

  fuzz:
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-22
    name: Unicode, ANSI, and document fuzz regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned fuzz toolchain and driver
        run: |
          rustup toolchain install nightly-2026-10-22 --profile minimal
          cargo +nightly-2026-10-22 install cargo-fuzz --version 0.13.2 --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: nightly-asan-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Fuzz byte streams and document rendering with sanitizers
        run: |
          python3 scripts/seed-fuzz-corpus.py
          cargo +nightly-2026-10-22 fuzz run byte_stream -- -max_total_time=60 -max_len=131072 -timeout=10
      - name: Upload reproducible fuzz failure inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-inputs
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  homebrew-local:
    name: Local Homebrew install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Homebrew
        if: runner.os == 'Linux'
        run: |
          if [[ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]]; then
            curl --fail --silent --show-error --location \
              https://raw.githubusercontent.com/Homebrew/install/85d1a3fc80d8a63932f632aca8f787de11d14a64/install.sh \
              --output "$RUNNER_TEMP/install-homebrew.sh"
            NONINTERACTIVE=1 bash "$RUNNER_TEMP/install-homebrew.sh"
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-homebrew-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Build from this checkout and install through a local tap
        run: |
          scripts/build-local-archive.sh
          scripts/check-homebrew-install.sh
      - name: Check source formula fetch compatibility
        run: HOMEBREW_DEVELOPER=1 brew ruby scripts/check-homebrew-formula.rb
      - name: Install the repository source formula from main
        run: scripts/check-homebrew-install.sh --source

  snap-local:
    name: Local Snap build, install, and use
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Prepare snapd and the pinned Snapcraft builder
        run: |
          sudo apt-get update
          sudo apt-get install --yes snapd
          sudo systemctl enable --now snapd.socket
          sudo snap wait system seed.loaded
          sudo snap install snapcraft --classic --revision=17614
          sudo snap install core24
          echo /snap/bin >> "$GITHUB_PATH"
          /snap/bin/snapcraft --version
      - name: Build, install, use, and remove the unsigned local Snap
        run: |
          scripts/build-snap-candidate.sh "$RUNNER_TEMP/bionic-reader-snap"
          scripts/check-snap-install.sh "$RUNNER_TEMP"/bionic-reader-snap/bionic-reader_*.snap

  node-local-macos:
    name: Local npm, Yarn, and pnpm installs (macOS)
    needs: portable-core
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - name: Install build tools
        # zizmor: ignore[adhoc-packages] Corepack is pinned; lifecycle scripts and lockfile writes are disabled.
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
          npm install --prefix "$RUNNER_TEMP/node-tools" --ignore-scripts --no-save --no-audit --no-fund --package-lock=false corepack@0.36.0
          echo "$RUNNER_TEMP/node-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: msrv-node-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-library-payload
          path: dist/library
      - name: Build local archive and test local Node tarball installations
        run: |
          scripts/build-local-archive.sh
          scripts/package-npm.sh --local
          scripts/check-node-package-installs.sh target/aarch64-apple-darwin/release/bionic-reader
          NODE_PACKAGE_MODE=standalone scripts/check-node-package-installs.sh target/aarch64-apple-darwin/release/bionic-reader
          NODE_PACKAGE_MODE=registry scripts/check-node-package-installs.sh target/aarch64-apple-darwin/release/bionic-reader

  framework-loader-tests:
    name: Pinned shell-framework loader tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install session test shells
        run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - name: Install Rust toolchain and fetch locked dependencies
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
          cargo fetch --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: msrv-frameworks-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Secure runner Zsh completion directories
        # Preserve the frameworks' compaudit checks on hosted-runner directories.
        run: |
          while IFS= read -r directory; do
            sudo chmod go-w "$directory"
          done < <(zsh -fc 'autoload -Uz compaudit; compaudit || true')
      - name: Fetch and test pinned upstream framework loaders
        run: scripts/check-frameworks.sh

  distribution-static:
    name: Distribution static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - name: Install static check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish shellcheck zsh
          python -m pip install --disable-pip-version-check -r packaging/python/requirements-checks.txt
      - name: Check package sources
        run: scripts/check-distribution.sh

  target-builds:
    name: Candidate build (${{ matrix.target }})
    needs: portable-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            zig: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            zig: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Install pinned Python packaging tools
        run: python3 -m pip install --disable-pip-version-check maturin==1.15.0 uv==0.13.5
      - name: Install the portable Linux wheel linker
        if: matrix.zig || matrix.musl
        run: |
          python3 -m pip install --disable-pip-version-check ziglang==0.15.1
          zig_dir=$(python3 -c 'from pathlib import Path; import ziglang; print(Path(ziglang.__file__).parent)')
          test -x "$zig_dir/zig"
          echo "$zig_dir" >> "$GITHUB_PATH"
      - name: Install the GNU binary build toolchain
        if: matrix.zig
        run: rustup toolchain install stable --profile minimal
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: matrix.zig
        with:
          tool: cargo-zigbuild@0.23.4
          checksum: true
          fallback: none
      - name: Install musl target tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: msrv-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-library-payload
          path: dist/library
      - name: Build local candidate
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: scripts/build-release.sh "$CANDIDATE_TARGET"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-cyclonedx@0.5.9
          checksum: true
          fallback: none
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.zig
        with:
          go-version: '1.26.4'
          cache: false
      - name: Build direct-install Linux packages
        if: matrix.zig
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: |
          go install -ldflags="-X main.version=2.47.0" github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          go_bin="$(go env GOPATH)/bin"
          export PATH="$go_bin:$PATH"
          scripts/package-linux.sh "$CANDIDATE_TARGET" "$RUNNER_TEMP/system-packages"
      - name: Build the wheel without installing it
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
          WHEEL_BUILD_ONLY: '1'
        run: scripts/build-python-wheel.sh "$CANDIDATE_TARGET" "$RUNNER_TEMP/python-wheels"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - name: Stage and verify the complete target bundle
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/bundle
          cp dist/candidates/v*/bionic-reader-v*-"$CANDIDATE_TARGET".tar.gz dist/bundle/
          cp "$RUNNER_TEMP"/python-wheels/*.whl dist/bundle/
          cp dist/library/library-performance.json dist/bundle/
          if [[ -d "$RUNNER_TEMP/system-packages" ]]; then
            cp "$RUNNER_TEMP"/system-packages/* dist/bundle/
          fi
          python3 scripts/package-release-node.py dist/bundle/*.tar.gz --output dist/bundle
          scripts/generate-sbom.sh "$CANDIDATE_TARGET" dist/bundle
          python3 scripts/candidate-checksums.py dist/bundle
          python3 scripts/candidate-checksums.py dist/bundle --verify
      - name: Install and use the verified archive and wheel
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/candidate-checksums.py dist/bundle --verify
          install_root="$RUNNER_TEMP/bionic-reader-archive"
          mkdir -p "$install_root"
          tar -xzf dist/bundle/*.tar.gz --strip-components=1 -C "$install_root"
          python3 scripts/check-installed-cli.py "$install_root/bin/bionic-reader"
          scripts/check-python-wheel-install.sh "$CANDIDATE_TARGET" dist/bundle/*.whl
      - name: Install and use the exact standalone npm release package
        # zizmor: ignore[adhoc-packages] Tests the verified local tarball offline, with lifecycle scripts disabled.
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: |
          # Standalone musl packages declare their static binary's glibc compatibility.
          npm install --prefix "$RUNNER_TEMP/release-node" --offline --ignore-scripts \
            --no-audit --no-fund "$GITHUB_WORKSPACE"/dist/bundle/*.npm.tgz
          python3 scripts/check-installed-cli.py "$RUNNER_TEMP/release-node/node_modules/.bin/bionic-reader"
      - name: Import the musllinux wheel on its actual libc runtime
        if: matrix.musl
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/dist/bundle:/wheel:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/checks:ro" \
            -v "$GITHUB_WORKSPACE/tests/fixtures:/fixtures:ro" \
            python:3.13-alpine@sha256:8bcfa47b04b853a17aaf909362b847b2112fd6ec4105ea553ef9a43bafbb5916 \
            sh -eu -c 'pip install --no-index --no-deps /wheel/*.whl; python /checks/check-python-library.py /fixtures/library.json; bionic-reader --version'
      - name: Build and install the build guide's host-local Python wheel
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [[ $host == "$CANDIDATE_TARGET" ]]; then
            scripts/build-python-wheel.sh --local "$host" "$RUNNER_TEMP/local-python-wheels"
          fi
      - name: Upload workflow candidate artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bionic-reader-${{ matrix.target }}
          path: dist/bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux-package-install-smoke:
    name: Signed Debian, Fedora, and Arch install smokes
    needs: target-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
          rustup toolchain install stable --profile minimal
      - name: Install pinned candidate build tools
        run: |
          python -m pip install --disable-pip-version-check ziglang==0.15.1
          zig_dir=$(python3 -c 'from pathlib import Path; import ziglang; print(Path(ziglang.__file__).parent)')
          test -x "$zig_dir/zig"
          echo "$zig_dir" >> "$GITHUB_PATH"
          go install -ldflags="-X main.version=2.47.0" github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-zigbuild@0.23.4
          checksum: true
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: msrv-zig-package-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-x86_64-unknown-linux-gnu
          path: dist/package-bundle
      - name: Install the exact candidate packages in distro containers
        env:
          PACKAGE_INPUT_DIR: ${{ github.workspace }}/dist/package-bundle
        run: scripts/package-manager-install-smoke.sh

  macos-shell-tests:
    name: macOS shell tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Install fish
        run: brew install fish
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: msrv-shell-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Unit, CLI, PTY, and launcher tests on macOS Bash 3.2
        run: cargo test --locked --all-targets
      - name: Check generated completion files
        run: scripts/check-completions.sh target/debug/bionic-reader

  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: typos@1.51.1,zizmor@1.31.1,cargo-deny@0.20.2
          checksum: true
          fallback: none
      - name: Install standalone linters and Python tools
        run: |
          scripts/install-workflow-tools.sh "$RUNNER_TEMP/workflow-tools"
          echo "$RUNNER_TEMP/workflow-tools" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check -r packaging/python/requirements-checks.txt
      - name: Check workflows, spelling, local links, anchors and rejection cases
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cargo fetch --locked
          make workflow-check docs-check ci-policy-check ci-negative-check

  source-install:
    name: Source install and use (${{ matrix.runner }}, Rust ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            toolchain: '1.85.1'
          - runner: ubuntu-24.04-arm
            toolchain: '1.85.1'
          - runner: macos-15-intel
            toolchain: '1.85.1'
          - runner: macos-15
            toolchain: '1.85.1'
          - runner: ubuntu-24.04
            toolchain: stable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Install Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.runner != 'ubuntu-24.04' || matrix.toolchain != '1.85.1'
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: source-${{ matrix.toolchain }}-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Compile and install from the checkout
        run: cargo install --path . --locked --root "$RUNNER_TEMP/bionic-reader-install"
      - name: Use the installed executable and reading session
        run: python3 scripts/check-installed-cli.py "$RUNNER_TEMP/bionic-reader-install/bin/bionic-reader"
      - name: Uninstall the source installation
        run: |
          cargo uninstall --root "$RUNNER_TEMP/bionic-reader-install" bionic-reader
          test ! -e "$RUNNER_TEMP/bionic-reader-install/bin/bionic-reader"
      - name: Install from the checkout's Git commit and use the installed tool
        run: scripts/check-cargo-git-install.sh
      - name: Package, install, and use the Cargo crate
        run: scripts/check-cargo-package.sh

  glibc-runtime:
    name: glibc 2.28 runtime (${{ matrix.target }})
    needs: target-builds
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-${{ matrix.target }}
          path: dist/bundle
      - name: Verify the bundle before extracting or executing it
        run: python3 scripts/candidate-checksums.py dist/bundle --verify
      - name: Exercise the advertised GNU runtime minimum offline
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges             --read-only --tmpfs /tmp:rw,exec,nosuid,nodev             --volume "$PWD/dist/bundle:/bundle:ro"             --volume "$PWD/scripts/check-glibc-runtime.sh:/check.sh:ro"             debian:buster-slim@sha256:bb3dc79fddbca7e8903248ab916bb775c96ec61014b3d02b4f06043b604726dc             bash /check.sh /bundle

  library-node:
    name: Library Node ${{ matrix.node }} (${{ matrix.runner }})
    needs: portable-core
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-library-api
          path: dist
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:node -- dist/library-api.tgz

  library-react:
    name: React ${{ matrix.react }} public APIs
    needs: portable-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: '18.3.1'
            types: '18.3.31'
          - react: '19.3.1'
            types: '19.3.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-library-api
          path: dist
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test installed React APIs and declarations
        env:
          BIONIC_REACT_VERSION: ${{ matrix.react }}
          BIONIC_REACT_TYPES: ${{ matrix.types }}
        run: npm run check:node -- dist/library-api.tgz

  library-examples:
    name: ${{ matrix.example }} (${{ matrix.browser }}, ${{ matrix.channel }}, React ${{ matrix.react }})
    needs: portable-core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: browser
            browser: chromium
            channel: chrome
          - example: browser
            browser: chromium
            channel: msedge
          - example: browser
            browser: firefox
          - example: react
            browser: chromium
            channel: chrome
            react: '18.3.1'
          - example: react
            browser: chromium
            channel: chrome
            react: '19.3.1'
          - example: next
            browser: chromium
            channel: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-library-api
          path: dist
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the actual selected browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_CHANNEL: ${{ matrix.channel }}
        run: node_modules/.bin/playwright install --with-deps "${TEST_CHANNEL:-$TEST_BROWSER}"
      - name: Build, serve, and verify the installed example
        env:
          BIONIC_BROWSER: ${{ matrix.browser }}
          BIONIC_BROWSER_CHANNEL: ${{ matrix.channel }}
          BIONIC_REACT_VERSION: ${{ matrix.react }}
          BIONIC_EXAMPLE_EVIDENCE: ${{ github.workspace }}/example-evidence.json
          TEST_EXAMPLE: ${{ matrix.example }}
        run: npm run check:example -- "$TEST_EXAMPLE" dist/library-api.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: library-${{ matrix.example }}-${{ matrix.browser }}-${{ matrix.channel }}-${{ matrix.react }}
          path: example-evidence.json
          if-no-files-found: error

  library-safari:
    name: Actual Safari browser conformance
    needs: portable-core
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-library-api
          path: dist
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enable automation only on the disposable CI runner
        run: sudo /usr/bin/safaridriver --enable
      - name: Verify the installed package in actual Safari
        env:
          BIONIC_BROWSER: safari
          BIONIC_EXAMPLE_EVIDENCE: ${{ github.workspace }}/safari-evidence.json
        run: npm run check:example -- browser dist/library-api.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: library-actual-safari
          path: safari-evidence.json
          if-no-files-found: error

  library-python:
    name: Installed library CPython ${{ matrix.python }}
    needs: target-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-x86_64-unknown-linux-gnu
          path: dist/python-candidate
      - name: Check and import the exact candidate wheel
        run: |
          python scripts/candidate-checksums.py dist/python-candidate --verify
          python -m pip install --no-index --no-deps dist/python-candidate/*.whl
          python scripts/check-python-library.py tests/fixtures/library.json

  attest-candidates:
    name: Attest main candidates (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: target-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      # No checkout or execution of candidate contents in this privileged job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bionic-reader-${{ matrix.target }}
          path: bundle
      - name: Verify all artifact digests
        working-directory: bundle
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest build provenance for the entire bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bundle/*
      - name: Attest the target SBOM for the archive and wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            bundle/*.tar.gz
            bundle/*.whl
          sbom-path: bundle/sbom.cdx.json
      - name: Verify repository, workflow, commit and digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in bundle/*.tar.gz bundle/*.whl; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"               --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"               --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"               --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"               --source-digest "$GITHUB_SHA" --deny-self-hosted-runners               --predicate-type https://cyclonedx.org/bom
          done

  ci-gate:
    name: CI gate
    if: always()
    needs: [library-node, library-react, library-examples, library-safari, library-python, portable-core, rust, coverage, rust-maintenance, miri, fuzz, homebrew-local, snap-local, node-local-macos, framework-loader-tests, distribution-static, target-builds, linux-package-install-smoke, macos-shell-tests, workflow-lint, source-install, glibc-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every PR matrix job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-gate.py library-node library-react library-examples library-safari library-python portable-core rust coverage rust-maintenance miri fuzz homebrew-local snap-local node-local-macos framework-loader-tests distribution-static target-builds linux-package-install-smoke macos-shell-tests workflow-lint source-install glibc-runtime
