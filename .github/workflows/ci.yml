name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Install session test shells
        run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - name: Install pinned Corepack in a temporary tool prefix
        run: |
          npm --cache "$RUNNER_TEMP/corepack-npm-cache" install \
            --prefix "$RUNNER_TEMP/bionic-reader-node-tools" \
            --ignore-scripts --no-save --no-audit --no-fund --package-lock=false \
            corepack@0.36.0
          echo "$RUNNER_TEMP/bionic-reader-node-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check and lint
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - name: Unit, CLI, and PTY tests
        run: |
          cargo test --locked --all-targets
          cargo test --locked --doc
      - name: Package, install, and test the Cargo crate
        run: |
          scripts/check-cargo-package.sh
          package_manifest=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          package = next(package for package in metadata["packages"] if package["name"] == "bionic-reader")
          print("{}/package/{}-{}/Cargo.toml".format(metadata["target_directory"], package["name"], package["version"]))
          ')
          cargo test --locked --all-targets --manifest-path "$package_manifest"
      - name: Upload Cargo crate candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bionic-reader-cargo-crate
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 14
      - name: Check generated completion files
        run: scripts/check-completions.sh target/debug/bionic-reader
      - name: Test offline npm, Yarn PnP, and pnpm installs
        run: scripts/check-node-package-installs.sh target/debug/bionic-reader

  framework-loader-tests:
    name: Pinned shell-framework loader tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install session test shells
        run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - name: Install Rust toolchain and fetch locked dependencies
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          cargo fetch --locked
      - name: Secure runner Zsh completion directories
        # Preserve the frameworks' compaudit checks on hosted-runner directories.
        run: |
          while IFS= read -r directory; do
            sudo chmod go-w "$directory"
          done < <(zsh -fc 'autoload -Uz compaudit; compaudit || true')
      - name: Fetch and test pinned upstream framework loaders
        run: scripts/check-frameworks.sh

  distribution-static:
    name: Distribution static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - name: Install static check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish shellcheck zsh
          python -m pip install --disable-pip-version-check -r packaging/python/requirements-checks.txt
      - name: Check package sources
        run: scripts/check-distribution.sh

  target-builds:
    name: Candidate build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            zig: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            zig: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Install pinned Python packaging tools
        run: python3 -m pip install --disable-pip-version-check maturin==1.15.0 uv==0.13.5
      - name: Install GNU target build tools
        if: matrix.zig
        run: |
          python3 -m pip install --disable-pip-version-check ziglang==0.15.1
          zig_dir=$(python3 -c 'from pathlib import Path; import ziglang; print(Path(ziglang.__file__).parent)')
          test -x "$zig_dir/zig"
          echo "$zig_dir" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-zigbuild --version 0.23.4 --locked
      - name: Install musl target tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build local candidate
        run: scripts/build-release.sh '${{ matrix.target }}'
      - name: Install and use the native archive
        env:
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: |
          archive=$(find dist/candidates -name "bionic-reader-v*-$CANDIDATE_TARGET.tar.gz" -type f)
          test -n "$archive"
          install_root="$RUNNER_TEMP/bionic-reader-archive"
          mkdir -p "$install_root"
          tar -xzf "$archive" --strip-components=1 -C "$install_root"
          python3 scripts/check-installed-cli.py "$install_root/bin/bionic-reader"
      - name: Build target wheel and smoke-test matching hosts
        run: scripts/build-python-wheel.sh '${{ matrix.target }}' "$RUNNER_TEMP/python-wheels"
      - name: Upload workflow candidate artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bionic-reader-${{ matrix.target }}
          path: |
            dist/candidates/v*/bionic-reader-v*-${{ matrix.target }}.tar.gz
            dist/candidates/v*/SHA256SUMS
            ${{ runner.temp }}/python-wheels/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux-package-install-smoke:
    name: Signed Debian, Fedora, and Arch install smokes
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          rustup toolchain install stable --profile minimal
      - name: Install pinned candidate build tools
        run: |
          python -m pip install --disable-pip-version-check ziglang==0.15.1
          zig_dir=$(python3 -c 'from pathlib import Path; import ziglang; print(Path(ziglang.__file__).parent)')
          test -x "$zig_dir/zig"
          echo "$zig_dir" >> "$GITHUB_PATH"
          cargo +stable install cargo-zigbuild --version 0.23.4 --locked
          go install -ldflags="-X main.version=2.47.0" github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build signed-repository candidates and install in distro containers
        run: scripts/package-manager-install-smoke.sh

  macos-shell-tests:
    name: macOS shell tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Install fish
        run: brew install fish
      - name: Unit, CLI, PTY, and launcher tests on macOS Bash 3.2
        run: cargo test --locked --all-targets
      - name: Check generated completion files
        run: scripts/check-completions.sh target/debug/bionic-reader

  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
          cache: false
      - name: Install pinned actionlint
        run: GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check workflow syntax, expressions, and inline shell scripts
        run: '"$RUNNER_TEMP/actionlint-bin/actionlint" -color'

  source-install:
    name: Source install and use (${{ matrix.runner }}, Rust ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            toolchain: '1.85.1'
          - runner: ubuntu-24.04-arm
            toolchain: '1.85.1'
          - runner: macos-15-intel
            toolchain: '1.85.1'
          - runner: macos-15
            toolchain: '1.85.1'
          - runner: ubuntu-24.04
            toolchain: stable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Install Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: source-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            source-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-
      - name: Compile and install from the checkout
        run: cargo install --path . --locked --root "$RUNNER_TEMP/bionic-reader-install"
      - name: Use the installed executable and reading session
        run: python3 scripts/check-installed-cli.py "$RUNNER_TEMP/bionic-reader-install/bin/bionic-reader"
      - name: Uninstall the source installation
        run: |
          cargo uninstall --root "$RUNNER_TEMP/bionic-reader-install" bionic-reader
          test ! -e "$RUNNER_TEMP/bionic-reader-install/bin/bionic-reader"
      - name: Package, install, and use the Cargo crate
        run: scripts/check-cargo-package.sh
