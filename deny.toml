[graph]
all-features = true
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
]
confidence-threshold = 0.8
# Private packages (including the fuzz harness) must also carry a license.
private = { ignore = false }
# Approved 2026-10-26: the pinned fuzz runtime declares an additional NCSA
# requirement. This exception applies to this exact tool-only crate version;
# NCSA remains prohibited for every other package and future version.
exceptions = [{ crate = "libfuzzer-sys@=0.4.10", allow = ["NCSA"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# cargo-deny distinguishes path dependencies from registry wildcards. The fuzz
# harness intentionally depends on the first-party parent package by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
