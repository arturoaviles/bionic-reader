[package]
name = "bionic-reader"
version.workspace = true
edition = "2024"
rust-version = "1.85.1"
description = "Configurable bionic reading for text streams and interactive shells"
license = "MIT"
repository = "https://github.com/arturoaviles/bionic-reader"
readme = "README.md"
keywords = ["bionic-reading", "cli", "terminal", "text"]
categories = ["command-line-utilities", "text-processing"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "src/**",
    "benches/**",
    "/examples/reading.rs",
    "tests/**",
    "completions/**",
    "integrations/**",
    "packaging/config.example.toml",
    "packaging/npm/bin/bionic-reader.js",
    "scripts/create_archive.py",
]

[workspace]
members = ["bindings/python", "bindings/wasm"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.2.0"

[features]
default = ["cli"]
config = ["dep:toml"]
native = ["config", "dep:tempfile"]
cli = ["native", "dep:clap", "dep:clap_complete", "dep:libc", "dep:portable-pty", "dep:shell-words", "dep:signal-hook", "dep:unicode-width"]

[[bin]]
name = "bionic-reader"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
clap_complete = { version = "4.5", optional = true }
icu_segmenter = "=2.1.2"
libc = { version = "0.2", optional = true }
portable-pty = { version = "0.9", optional = true }
pulldown-cmark = { version = "=0.13.5", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
shell-words = { version = "1", optional = true }
signal-hook = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
toml = { version = "1.1", optional = true }
unicode-segmentation = "1.12"
unicode-width = { version = "=0.2.2", optional = true }

[dev-dependencies]
serde_json = "1"
divan = "=0.1.21"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[[bench]]
name = "transformer"
harness = false

[lints.rust]
ambiguous_negative_literals = "warn"
missing_docs = "deny"
missing_debug_implementations = "deny"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
unused_must_use = "deny"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[profile.release]
lto = "thin"
strip = true

# Rust's Mach-O stripper can emit a string table rejected by current macOS dyld.
# Keep the extension loadable; installed-wheel tests exercise the actual artifact.
# https://github.com/rust-lang/rust/issues/157750
[profile.python-wheel]
inherits = "release"
strip = false

[profile.bench]
debug = 1

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "completions"
required-features = ["cli"]

[[test]]
name = "distribution"
required-features = ["cli"]

[[test]]
name = "documents"
required-features = ["cli"]

[[test]]
name = "e2e"
required-features = ["cli"]

[[test]]
name = "frameworks"
required-features = ["cli"]

[[test]]
name = "preferences"
required-features = ["cli"]

[[test]]
name = "properties"
required-features = ["cli"]

[[test]]
name = "reader"
required-features = ["cli"]

[[test]]
name = "session"
required-features = ["cli"]

[[test]]
name = "stream_regressions"
required-features = ["cli"]

[[test]]
name = "terminal"
required-features = ["cli"]
