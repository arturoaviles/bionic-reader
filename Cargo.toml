[package]
name = "bionic-reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
description = "Configurable bionic reading for text streams and interactive shells"
license = "MIT"
repository = "https://github.com/arturoaviles/bionic-reader"
readme = "README.md"
keywords = ["bionic-reading", "cli", "terminal", "text"]
categories = ["command-line-utilities", "text-processing"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "src/**",
    "benches/**",
    "tests/**",
    "completions/**",
    "integrations/**",
    "packaging/config.example.toml",
    "packaging/npm/bin/bionic-reader.js",
    "scripts/create_archive.py",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
icu_segmenter = "=2.1.2"
libc = "0.2"
portable-pty = "0.9"
pulldown-cmark = { version = "=0.13.1", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
shell-words = "1"
signal-hook = "0.4"
tempfile = "3"
toml = "0.9"
unicode-segmentation = "1.12"
unicode-width = "=0.2.0"

[dev-dependencies]
divan = "=0.1.21"
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }

[[bench]]
name = "transformer"
harness = false

[lints.rust]
ambiguous_negative_literals = "warn"
missing_docs = "deny"
missing_debug_implementations = "deny"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
unused_must_use = "deny"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[profile.release]
lto = "thin"
strip = true

[profile.bench]
debug = 1
