[package]
name = "bionic-reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
description = "Configurable bionic reading for text streams and interactive shells"
license = "MIT"
repository = "https://github.com/arturoaviles/bionic-reader"
readme = "README.md"
keywords = ["bionic-reading", "cli", "terminal", "text"]
categories = ["command-line-utilities", "text-processing"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "src/**",
    "tests/**",
    "completions/**",
    "integrations/**",
    "packaging/config.example.toml",
    "packaging/npm/bin/bionic-reader.js",
    "scripts/create_archive.py",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
signal-hook = "0.3"
tempfile = "3"
toml = "0.9"
unicode-script = "0.5"
unicode-segmentation = "1.12"

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[profile.release]
lto = "thin"
strip = true
