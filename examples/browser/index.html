<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bionic Reader browser example</title>
<style>
  body { max-width: 52rem; margin: 3rem auto; padding: 0 1rem; font: 1rem/1.6 system-ui; }
  label { display: block; margin-top: 1rem; }
  textarea { box-sizing: border-box; width: 100%; min-height: 6rem; font: inherit; }
  #preview { white-space: pre-wrap; font-size: 1.4rem; }
  .emphasized { font-weight: 700; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: #f2f2f2; }
</style>
<h1>Bionic Reader in a browser</h1>
<p id="status" role="status">Loading the bundled engine…</p>
<label for="text">Text</label>
<textarea id="text">Hello world</textarea>
<label for="options">Options (JSON)</label>
<textarea id="options">{}</textarea>
<label for="format">Output format</label>
<select id="format"><option>html</option><option>markdown</option><option>ansi</option><option>plain</option></select>
<button id="render" disabled>Render</button>
<h2>Custom presentation from text segments</h2>
<div id="preview"></div>
<h2>Formatted output</h2><pre id="output"></pre>
<h2>Text segments</h2><pre id="segments"></pre>
<script type="module" src="/main.js"></script>
</html>
