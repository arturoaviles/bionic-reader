[package]
name = "bionic-reader-python"
version.workspace = true
edition = "2024"
rust-version = "1.85.1"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bionic-reader = { path = "../..", default-features = false, features = ["config"] }
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py311"] }
serde_json = "1"
